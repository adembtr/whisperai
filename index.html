<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>English Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 200px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4ecca3;
        }

        header p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
            margin-top: 5px;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 16px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, #4ecca3 0%, #38b587 100%);
            color: #1a1a2e;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .message-audio {
            width: 100%;
            height: 40px;
            border-radius: 20px;
        }

        .message-time {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 8px;
        }

        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, #1a1a2e 80%, transparent);
            padding: 30px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .status {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
            text-align: center;
            min-height: 24px;
        }

        .status.recording {
            color: #ff6b6b;
        }

        .status.processing {
            color: #ffd93d;
        }

        .talk-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #4ecca3 0%, #38b587 100%);
            color: #1a1a2e;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(78, 204, 163, 0.4);
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        .talk-btn:active, .talk-btn.active {
            transform: scale(1.1);
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 4px 30px rgba(255, 107, 107, 0.5);
        }

        .talk-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .talk-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.5);
        }

        .welcome svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            padding: 8px;
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
        }

        .settings-panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .settings-panel.active {
            display: block;
        }

        .settings-panel h2 {
            margin-bottom: 20px;
            color: #4ecca3;
        }

        .settings-panel label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
        }

        .settings-panel input, .settings-panel select, .settings-panel textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .settings-panel textarea {
            min-height: 120px;
            resize: vertical;
        }

        .settings-panel .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .btn-save {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #4ecca3 0%, #38b587 100%);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .clear-btn {
            background: rgba(255,107,107,0.2);
            border: 1px solid rgba(255,107,107,0.3);
            color: #ff6b6b;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 20px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎤 English Practice</h1>
            <p>Hold the button and speak</p>
            <button class="settings-btn" onclick="toggleSettings()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
        </header>

        <div class="chat-container" id="chatContainer">
            <div class="welcome">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                <p>Tap and hold the microphone button to start speaking. Your conversation history will appear here.</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <div class="status" id="status">Ready to listen</div>
        <button class="talk-btn" id="talkBtn">
            <svg viewBox="0 0 24 24"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <div class="hint">Hold to speak</div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <button class="close-btn" onclick="toggleSettings()">×</button>
        <h2>⚙️ Settings</h2>
        
        <label>OpenRouter API Key</label>
        <input type="password" id="apiKey" placeholder="sk-or-v1-...">
        
        <label>AI Model</label>
        <select id="aiModel">
            <optgroup label="💰 Budget (Cheapest)">
                <option value="minimax/minimax-m2.1">minimax/minimax-m2.1 ($0.20/M)</option>
                <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash ($0.10/M)</option>
                <option value="openai/gpt-4o-mini">GPT-4o Mini ($0.15/M)</option>
                <option value="meta-llama/llama-3.1-8b-instruct">Llama 3.1 8B ($0.05/M)</option>
            </optgroup>
            <optgroup label="⚡ Balanced">
                <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku ($0.80/M)</option>
                <option value="openai/gpt-4o">GPT-4o ($2.50/M)</option>
                <option value="google/gemini-pro-1.5">Gemini Pro 1.5 ($1.25/M)</option>
            </optgroup>
            <optgroup label="🚀 Premium">
                <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet ($3/M)</option>
                <option value="openai/gpt-4-turbo">GPT-4 Turbo ($10/M)</option>
            </optgroup>
        </select>
        
        <label>n8n Webhook URL (TTS)</label>
        <input type="text" id="webhookUrl" placeholder="https://your-n8n-url/webhook/tts">
        
        <label>System Prompt (AI Personality)</label>
        <textarea id="systemPrompt">You are Alex, a friendly American friend who loves chatting about everyday life. You're casual, warm, and supportive.

CONVERSATION STYLE:
- Talk like a real friend, not a teacher
- Use casual language: "Hey!", "That's awesome!", "No way!", "Oh man..."
- Keep responses SHORT (1-3 sentences max)
- Ask follow-up questions to keep the chat going
- Share your own "experiences" and opinions

TOPICS YOU LOVE:
- Daily life, work, hobbies
- Food, restaurants, cooking
- Movies, TV shows, music
- Travel, weekend plans
- Sports, fitness, health
- Tech, games, social media

LANGUAGE HELP:
- If the user makes a small grammar mistake, don't correct it directly
- Only help if they ask or if it's a big misunderstanding
- Be encouraging: "Nice!", "Good point!", "I totally get that"

Remember: You're a friend having coffee together, not a language teacher!</textarea>
        
        <button class="btn-save" onclick="saveSettings()">Save Settings</button>
        <button class="clear-btn" onclick="clearHistory()">🗑️ Clear Conversation History</button>
    </div>

    <script>
        // Configuration
        let CONFIG = {
            apiKey: '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',
            aiModel: 'minimax/minimax-m2.1',
            webhookUrl: 'https://postposted-import-cuts-devices.trycloudflare.com/webhook/tts',
            systemPrompt: `You are Alex, a friendly American friend who loves chatting about everyday life. You're casual, warm, and supportive.

CONVERSATION STYLE:
- Talk like a real friend, not a teacher
- Use casual language: "Hey!", "That's awesome!", "No way!", "Oh man..."
- Keep responses SHORT (1-3 sentences max)
- Ask follow-up questions to keep the chat going
- Share your own "experiences" and opinions

TOPICS YOU LOVE:
- Daily life, work, hobbies
- Food, restaurants, cooking
- Movies, TV shows, music
- Travel, weekend plans
- Sports, fitness, health
- Tech, games, social media

LANGUAGE HELP:
- If the user makes a small grammar mistake, don't correct it directly
- Only help if they ask or if it's a big misunderstanding
- Be encouraging: "Nice!", "Good point!", "I totally get that"

Remember: You're a friend having coffee together, not a language teacher!`
        };

        // Load saved settings
        function loadSettings() {
            const saved = localStorage.getItem('voiceChatConfig');
            if (saved) {
                CONFIG = { ...CONFIG, ...JSON.parse(saved) };
            }
            document.getElementById('apiKey').value = CONFIG.apiKey;
            document.getElementById('aiModel').value = CONFIG.aiModel;
            document.getElementById('webhookUrl').value = CONFIG.webhookUrl;
            document.getElementById('systemPrompt').value = CONFIG.systemPrompt;
        }

        function saveSettings() {
            CONFIG.apiKey = document.getElementById('apiKey').value;
            CONFIG.aiModel = document.getElementById('aiModel').value;
            CONFIG.webhookUrl = document.getElementById('webhookUrl').value;
            CONFIG.systemPrompt = document.getElementById('systemPrompt').value;
            localStorage.setItem('voiceChatConfig', JSON.stringify(CONFIG));
            toggleSettings();
            setStatus('Settings saved!');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        // Conversation history
        let conversationHistory = [];
        
        function loadHistory() {
            const saved = localStorage.getItem('voiceChatHistory');
            if (saved) {
                conversationHistory = JSON.parse(saved);
                renderHistory();
            }
        }

        function saveHistory() {
            localStorage.setItem('voiceChatHistory', JSON.stringify(conversationHistory));
        }

        function clearHistory() {
            if (confirm('Clear all conversation history?')) {
                conversationHistory = [];
                localStorage.removeItem('voiceChatHistory');
                document.getElementById('chatContainer').innerHTML = `
                    <div class="welcome">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15c1.66 0 2.99-1.34 2.99-3L15 6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V22h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                        <p>Tap and hold the microphone button to start speaking. Your conversation history will appear here.</p>
                    </div>
                `;
                toggleSettings();
            }
        }

        function renderHistory() {
            const container = document.getElementById('chatContainer');
            if (conversationHistory.length === 0) return;
            
            container.innerHTML = '';
            conversationHistory.forEach(msg => {
                addMessageToUI(msg.role, msg.text, msg.audio, msg.time, false);
            });
            scrollToBottom();
        }

        // UI Functions
        const talkBtn = document.getElementById('talkBtn');
        const statusEl = document.getElementById('status');
        const chatContainer = document.getElementById('chatContainer');

        function setStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status ' + type;
        }

        function addMessageToUI(role, text, audioData = null, time = null, save = true) {
            const welcome = chatContainer.querySelector('.welcome');
            if (welcome) welcome.remove();

            const msgEl = document.createElement('div');
            msgEl.className = `message ${role}`;
            
            const timeStr = time || new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            let audioHTML = '';
            if (audioData) {
                audioHTML = `<audio class="message-audio" controls src="${audioData}"></audio>`;
            }

            msgEl.innerHTML = `
                <div class="message-text">${text}</div>
                ${audioHTML}
                <div class="message-time">${timeStr}</div>
            `;

            chatContainer.appendChild(msgEl);
            scrollToBottom();

            if (save) {
                conversationHistory.push({ role, text, audio: audioData, time: timeStr });
                saveHistory();
            }
        }

        function scrollToBottom() {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        // Speech Recognition
        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                setStatus('Speech recognition not supported');
                talkBtn.disabled = true;
                return false;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript + ' ';
                    } else {
                        interim += transcript;
                    }
                }
                if (interim || finalTranscript) {
                    setStatus(finalTranscript + interim, 'recording');
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error !== 'no-speech') {
                    setStatus('Error: ' + event.error);
                }
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                }
            };

            return true;
        }

        function startRecording() {
            if (!recognition && !initSpeechRecognition()) return;
            
            isRecording = true;
            finalTranscript = '';
            talkBtn.classList.add('active');
            setStatus('🎤 Listening...', 'recording');
            
            try {
                recognition.start();
            } catch (e) {
                // Already started
            }
        }

        function stopRecording() {
            isRecording = false;
            talkBtn.classList.remove('active');
            
            if (recognition) {
                recognition.stop();
            }

            const text = finalTranscript.trim();
            if (text) {
                processUserInput(text);
            } else {
                setStatus('No speech detected. Try again.');
            }
        }

        // Process user input
        async function processUserInput(text) {
            setStatus('🤔 Thinking...', 'processing');
            talkBtn.disabled = true;

            addMessageToUI('user', text);

            try {
                // Get AI response
                const aiResponse = await getAIResponse(text);
                
                // Get TTS audio from webhook
                setStatus('🔊 Generating voice...', 'processing');
                const audioData = await getTextToSpeech(aiResponse);
                
                // Add AI message with audio
                addMessageToUI('ai', aiResponse, audioData);
                
                // Auto-play the response
                if (audioData) {
                    const audio = new Audio(audioData);
                    audio.play().catch(e => console.log('Autoplay blocked'));
                }

                setStatus('Ready to listen');
            } catch (error) {
                console.error('Error:', error);
                addMessageToUI('ai', 'Sorry, there was an error: ' + error.message);
                setStatus('Error occurred. Try again.');
            }

            talkBtn.disabled = false;
        }

        // OpenRouter API
        async function getAIResponse(userMessage) {
            const messages = [
                { role: 'system', content: CONFIG.systemPrompt }
            ];

            // Add recent conversation context (last 10 messages)
            const recentHistory = conversationHistory.slice(-10);
            recentHistory.forEach(msg => {
                messages.push({
                    role: msg.role === 'user' ? 'user' : 'assistant',
                    content: msg.text
                });
            });

            messages.push({ role: 'user', content: userMessage });

            const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.apiKey}`,
                    'HTTP-Referer': window.location.origin,
                    'X-Title': 'English Practice'
                },
                body: JSON.stringify({
                    model: CONFIG.aiModel,
                    messages: messages,
                    max_tokens: 150
                })
            });

            if (!response.ok) {
                throw new Error('AI API error: ' + response.status);
            }

            const data = await response.json();
            return data.choices[0].message.content;
        }

        // n8n TTS Webhook - sends text, receives base64 audio
        async function getTextToSpeech(text) {
            try {
                const response = await fetch(CONFIG.webhookUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });

                if (!response.ok) {
                    throw new Error('TTS error: ' + response.status);
                }

                const data = await response.json();
                return data.audio; // base64 audio from n8n
            } catch (error) {
                console.error('TTS error:', error);
                return null;
            }
        }

        // Event listeners - Mouse
        talkBtn.addEventListener('mousedown', startRecording);
        talkBtn.addEventListener('mouseup', stopRecording);
        talkBtn.addEventListener('mouseleave', () => {
            if (isRecording) stopRecording();
        });

        // Touch events for mobile
        talkBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startRecording();
        });
        talkBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            stopRecording();
        });

        // Initialize
        loadSettings();
        loadHistory();
        initSpeechRecognition();
    </script>
</body>
</html>
